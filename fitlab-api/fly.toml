# fitlab-api — main HTTP server
app = 'fitlab-api'
primary_region = 'gru'

[build]
  [build.args]
    GO_VERSION = '1.21'

[env]
  ALLOWED_ORIGINS = 'https://fitab-lime.vercel.app'
  DATABASE_PATH = '/data/fitlab.db'
  DEV_MODE = 'false'
  PORT = '8080'

[[mounts]]
  source = 'fitlab_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'

# ============================================================
# fitlab-scheduler — notification scheduler (separate app)
# To deploy:
#   1. cp fly.toml fly-scheduler.toml
#   2. Edit fly-scheduler.toml:
#      - app = 'fitlab-scheduler'
#      - Remove [http_service]
#      - Add cmd = 'fitlab-scheduler'
#      - Set CHECK_INTERVAL env var (e.g., '5m')
#   3. fly launch --config fly-scheduler.toml --no-deploy
#   4. fly secrets import < .env.scheduler
#   5. fly deploy --config fly-scheduler.toml
# ============================================================
