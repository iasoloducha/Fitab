# fly.toml app configuration file generated for fitlab-scheduler on 2026-05-09T11:57:27-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fitlab-scheduler'
primary_region = 'gru'

[build]

[env]
  CHECK_INTERVAL = '5m'
  DATABASE_PATH = '/data/fitlab.db'
  RUN_MODE = 'scheduler'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
